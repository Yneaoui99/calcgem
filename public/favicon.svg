<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gemBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Gem shape centered at 32,34 -->
  <!-- Crown (top part) -->
  <polygon points="32,10 48,26 16,26" fill="url(#gemTop)"/>
  <!-- Pavilion left facet -->
  <polygon points="16,26 32,10 32,54" fill="url(#gemBot)" opacity="0.8"/>
  <!-- Pavilion right facet -->
  <polygon points="48,26 32,10 32,54" fill="white" opacity="0.55"/>
  <!-- Girdle line -->
  <line x1="16" y1="26" x2="48" y2="26" stroke="white" stroke-width="1" opacity="0.6"/>
  <!-- Inner crown line left -->
  <line x1="32" y1="10" x2="22" y2="26" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <!-- Inner crown line right -->
  <line x1="32" y1="10" x2="42" y2="26" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <!-- Center pavilion line -->
  <line x1="32" y1="26" x2="32" y2="54" stroke="white" stroke-width="0.8" opacity="0.35"/>
</svg>
